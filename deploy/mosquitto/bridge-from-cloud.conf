# Bridge opened by the CLOUD broker towards the edge broker (use when the edge 1883 is
# reachable from Milano). Put this file on the cloud broker only. Same flows as
# bridge-from-edge.conf, seen from the other side.
connection to-edge
address EDGE_BROKER_ADDRESS:1883
remote_clientid bridge-cloud-to-edge
cleansession false
restart_timeout 2 30

topic pipeline/edge/# out 1
topic pipeline/cloud/# in 1
topic control/placement/# out 1
topic control/status/edge in 1
topic observations/edge in 1
topic probe/edge/# out 1
topic probe/cloud/# in 1
