# Bridge opened by the EDGE broker towards the cloud broker (use when the cloud 1883 is
# reachable from Modena). Put this file on the edge broker only.
# Each prefix flows in one direction only, so messages cannot loop between the brokers.
connection to-cloud
address CLOUD_BROKER_ADDRESS:1883
remote_clientid bridge-edge-to-cloud
# Keep the session across WAN outages: messages are queued and delivered on reconnect.
cleansession false
restart_timeout 2 30

topic pipeline/cloud/# out 1
topic pipeline/edge/# in 1
topic control/placement/# in 1
topic control/status/edge out 1
topic observations/edge out 1
