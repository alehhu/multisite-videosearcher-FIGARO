# Local controller configuration (same file on both sites).
sample_interval_s: 5          # pod state / CPU sampling and drain checks
observation_interval_s: 120   # agent observation window (Pozzani's AGENT_INTERVAL)
drain_quiet_s: 10             # no arrivals for this long before a drained stage is stopped
drain_timeout_s: 1800         # stop a draining stage anyway after this long (logged)
ready_timeout_s: 600          # logged if a starting stage is not ready by then
agent_timeout_s: 3            # an agent that does not answer in time leaves the replicas unchanged

# Thresholds come from ServerlessAutoscalingWithRL/figaro/controller/config.py (single node,
# full video): they only scale `pressure` and must be recalibrated on the two-site setup.
stages:
  ffmpeg0:
    deployment: ffmpeg0-deployment
    app_label: ffmpeg0-function
    replicas: 1
    res_time_threshold: 2.03
    agent: {url: "http://agent-ffmpeg0:5000", min: 1, max: 10}
  librosa:
    deployment: librosa-deployment
    app_label: librosa-function
    replicas: 1
    res_time_threshold: 6.00
    agent: {url: "http://agent-librosa:5000", min: 1, max: 10}
  ffmpeg1:
    deployment: ffmpeg1-deployment
    app_label: ffmpeg1-function
    replicas: 1
    res_time_threshold: 2.08
    agent: {url: "http://agent-ffmpeg1:5000", min: 1, max: 10}
  ffmpeg2:
    deployment: ffmpeg2-deployment
    app_label: ffmpeg2-function
    replicas: 1
    res_time_threshold: 93.02
    agent: {url: "http://agent-ffmpeg2:5000", min: 1, max: 10}
  deepspeech:
    deployment: deepspeech-deployment
    app_label: deepspeech-function
    replicas: 1
    res_time_threshold: 103.52
    agent: {url: "http://agent-deepspeech:5000", min: 1, max: 10}
  grep:
    deployment: grep-deployment
    app_label: grep-function
    replicas: 1
    res_time_threshold: 0.17
    agent: {url: "http://agent-grep:5000", min: 1, max: 10}

# Scaling. With AGENTS=0 in the site settings (the default overlays) the `agent` blocks are
# ignored and every stage keeps `replicas` instances. With AGENTS=1 (overlays <site>-agents)
# the controller POSTs, every observation window, the normalised observation of each stage
# to <url>/action and applies the returned number of instances, between `min` and `max`.
# Instead of `agent`, a stage can have
#   hpa: {min: 1, max: 6, cpu_target: 60}
# to use a Kubernetes HPA on CPU.

# Normalisation of the DQN observation (rlagent.py / config.py of ServerlessAutoscalingWithRL).
normalization: {max_workload: 0.25, max_n_instances: 10, pressure_clip: 3, queue_length_clip: 10}
