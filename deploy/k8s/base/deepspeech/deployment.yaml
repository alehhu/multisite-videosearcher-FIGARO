apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepspeech-deployment
  labels:
    app: deepspeech-function
spec:
  selector:
    matchLabels:
      app: deepspeech-function
  template:
    metadata:
      labels:
        app: deepspeech-function
    spec:
      containers:
      - name: deepspeech
        image: deepspeech:latest
        imagePullPolicy: Never
        command: ["python3", "/opt/videosearcher/function.py"]
        resources:
          requests:
            cpu: "1000m"
            memory: "64Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        volumeMounts:
        - name: ramdisk
          mountPath: /mnt/ramdisk
      volumes:
      - name: ramdisk
        hostPath:
          path: /mnt/ramdisk
          type: DirectoryOrCreate
