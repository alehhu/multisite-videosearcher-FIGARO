apiVersion: apps/v1
kind: Deployment
metadata:
  name: dlq-consumer
  labels:
    app: dlq-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dlq-consumer
  template:
    metadata:
      labels:
        app: dlq-consumer
    spec:
      containers:
      - name: consumer
        image: eclipse-mosquitto:2.0
        command:
        - /bin/sh
        - -c
        - |
          apk add --no-cache mosquitto-clients
          echo "=== DLQ Consumer Started ==="
          echo "Listening for failed messages on Dead Letter Queue topic: pipeline/dlq"
          echo "This captures errors from any stage that fails during processing"
          echo ""
          mosquitto_sub -h mosquitto-service -t pipeline/dlq -v -q 1
