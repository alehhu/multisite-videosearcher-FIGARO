apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: ramdisk
          mountPath: /mnt/ramdisk
      volumes:
      - name: ramdisk
        hostPath:
          path: /mnt/ramdisk
          type: DirectoryOrCreate
