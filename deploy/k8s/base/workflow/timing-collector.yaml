apiVersion: apps/v1
kind: Deployment
metadata:
  name: timing-collector
  labels:
    app: timing-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timing-collector
  template:
    metadata:
      labels:
        app: timing-collector
    spec:
      containers:
      - name: timing-collector
        image: timing-collector:latest
        imagePullPolicy: Never
        env:
        - name: MQTT_BROKER
          value: mosquitto-service
        - name: MQTT_PORT
          value: "1883"
        - name: MQTT_TOPIC
          value: pipeline/done
        - name: LOG_DIR
          value: /var/log/pipeline-timings
        - name: LOG_FILE
          value: timing.jsonl
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        volumeMounts:
        - name: timing-logs
          mountPath: /var/log/pipeline-timings
      volumes:
      - name: timing-logs
        hostPath:
          path: /var/log/pipeline-timings
          type: DirectoryOrCreate
