apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-consumer
  labels:
    app: result-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result-consumer
  template:
    metadata:
      labels:
        app: result-consumer
    spec:
      containers:
      - name: consumer
        image: eclipse-mosquitto:2.0
        command:
        - /bin/sh
        - -c
        - |
          apk add --no-cache mosquitto-clients
          echo "=== Result Consumer Started ==="
          echo "Listening for successful pipeline completions on topic: pipeline/done"
          echo "This logs the final output from the grep stage after full pipeline execution"
          echo ""
          mosquitto_sub -h mosquitto-service -t pipeline/done -v -q 1
