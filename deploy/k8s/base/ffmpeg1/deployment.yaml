apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffmpeg1-deployment
  labels:
    app: ffmpeg1-function
spec:
  # replicas: 1; by default k8s creates 1 replica if not specified. Not defining replicas' number is useful for k8s' built-in HPA.
  selector:
    matchLabels:
      app: ffmpeg1-function
  template:
    metadata:
      labels:
        app: ffmpeg1-function
    spec:
      containers:
      - name: ffmpeg1
        image: ffmpeg1:latest
        imagePullPolicy: Never
        command: ["python3", "/opt/videosearcher/function.py"]
        resources:
          requests:
            cpu: "1000m"
            memory: "64Mi"
          limits:
            cpu: "1000m"
            memory: "256Mi"
        volumeMounts:
        - name: ramdisk
          mountPath: /mnt/ramdisk
      volumes:
      - name: ramdisk
        hostPath:
          path: /mnt/ramdisk
          type: DirectoryOrCreate
