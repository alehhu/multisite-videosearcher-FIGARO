apiVersion: apps/v1
kind: Deployment
metadata:
  name: librosa-deployment
  labels:
    app: librosa-function
spec:
  selector:
    matchLabels:
      app: librosa-function
  template:
    metadata:
      labels:
        app: librosa-function
    spec:
      containers:
      - name: librosa
        image: librosa:latest
        imagePullPolicy: Never
        command: ["python3", "/opt/videosearcher/function.py"]
        resources:
          requests:
            cpu: "1000m"
            memory: "64Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        volumeMounts:
        - name: ramdisk
          mountPath: /mnt/ramdisk
      volumes:
      - name: ramdisk
        hostPath:
          path: /mnt/ramdisk
          type: DirectoryOrCreate
