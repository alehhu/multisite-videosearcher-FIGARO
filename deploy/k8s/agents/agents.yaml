# Scaling agents: one per stage, the DQN agents of ServerlessAutoscalingWithRL, unchanged.
# All six use the same image (scripts/build-agent-image.sh) and differ only in the trained
# checkpoint they load. The controller of this site calls http://agent-<stage>:5000/action.
# No memory limit yet: the footprint of an agent (Ray + PyTorch) has to be measured first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-ffmpeg0
  labels:
    app: agent-ffmpeg0
    tier: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-ffmpeg0
  template:
    metadata:
      labels:
        app: agent-ffmpeg0
        tier: agent
    spec:
      containers:
      - name: agent
        image: figaro-production_agent:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: CHECKPOINT_PATH
          value: trained_checkpoint_cl1
        ports:
        - containerPort: 5000
          name: http
        # The server listens only after the checkpoint is loaded.
        readinessProbe:
          tcpSocket:
            port: 5000
          periodSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-ffmpeg0
spec:
  selector:
    app: agent-ffmpeg0
  ports:
  - port: 5000
    targetPort: 5000
---
