apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multisite
resources:
- namespace.yaml
- ../../base
configMapGenerator:
- name: site-config
  literals:
  - SITE=cloud
  - MQTT_BROKER=mosquitto-service
  - MQTT_PORT=1883
  - AGENTS=0   # fixed replicas; the overlay cloud-agents sets 1
