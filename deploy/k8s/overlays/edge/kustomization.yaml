apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multisite
resources:
- namespace.yaml
- ../../base
- gateway.yaml
- timing-collector.yaml
configMapGenerator:
- name: site-config
  literals:
  - SITE=edge
  - MQTT_BROKER=mosquitto-service
  - MQTT_PORT=1883
  - AGENTS=0   # fixed replicas; the overlay edge-agents sets 1
